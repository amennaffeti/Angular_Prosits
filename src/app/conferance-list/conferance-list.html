<h2>Conférences à venir</h2>

@for (topic of topics; track topic) {
    <button (click)="conferenceService.filterByTopic(topic)">
        {{ topic }}
    </button>
}

@for (c of conferenceService.filteredConferences(); track $index) {
    <p>ID : {{ c.id }}</p>
    <app-conferance-details [conf]="c"></app-conferance-details>
}
